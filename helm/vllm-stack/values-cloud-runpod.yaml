# RunPod Kubernetes — GPU values
# Cheapest path to a real GPU for this lab (~$0.20-0.50/hr for an RTX 4090)
#
# Setup:
#   1. runpod.io → Kubernetes → Create Cluster
#   2. Add a GPU worker: RTX 4090 (24GB VRAM) — cheapest option
#   3. Download kubeconfig → save as ~/runpod-kubeconfig.yaml
#   4. export KUBECONFIG=~/runpod-kubeconfig.yaml
#   5. kubectl get nodes   ← should show your GPU node Ready
#
# Deploy:
#   helm install vllm-stack helm/vllm-stack/ \
#     --namespace llm-serving --create-namespace \
#     --values helm/vllm-stack/values-cloud-runpod.yaml \
#     --set secrets.hfToken=$HF_TOKEN \
#     --set secrets.vllmApiKey=$VLLM_API_KEY

vllm:
  image:
    repository: vllm/vllm-openai
    tag: "v0.8.5"        # v0.8+ required for Qwen3 architecture support
    pullPolicy: IfNotPresent

  replicaCount: 1        # start with 1; scale up once smoke test passes

  gpu:
    enabled: true
    count: 1

  model:
    id: "Qwen/Qwen3-8B"              # open-access, no HF approval needed; fits in 24GB VRAM in BF16
    alias: "qwen3-8b"
    maxLen: 8192

  engine:
    tensorParallelSize: 1
    gpuMemoryUtilization: "0.90"      # leave 10% headroom for OS/k8s overhead
    maxNumSeqs: 256
    maxNumBatchedTokens: 8192
    swapSpace: 4
    enablePrefixCaching: true
    enableChunkedPrefill: true
    maxChunkedTokens: 512

  resources:
    requests:
      memory: 16Gi
      cpu: "4"
    limits:
      memory: 22Gi
      cpu: "8"

  nodeSelector: {}       # RunPod labels vary — leave empty or set after kubectl get nodes

  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule

  podAntiAffinity: false  # single node — anti-affinity has no effect

  persistence:
    enabled: false        # emptyDir per-pod; model re-downloads on restart

  probes:
    startup:
      initialDelaySeconds: 60
      periodSeconds: 10
      failureThreshold: 30   # 60 + 30×10 = 360s for model download + load
    readiness:
      initialDelaySeconds: 120
      periodSeconds: 10
      failureThreshold: 3
    liveness:
      initialDelaySeconds: 180
      periodSeconds: 30
      failureThreshold: 5

  pdb:
    enabled: false        # single replica — PDB has no effect

router:
  enabled: false          # skip router for initial smoke test

autoscaling:
  enabled: false

observability:
  serviceMonitor:
    enabled: false
  prometheusRule:
    enabled: false
  grafana:
    dashboardEnabled: false
