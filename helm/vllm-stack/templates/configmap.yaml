apiVersion: v1
kind: ConfigMap
metadata:
  name: vllm-config
  namespace: {{ include "vllm-stack.namespace" . }}
  labels:
    {{- include "vllm-stack.labels" . | nindent 4 }}
data:
  MODEL_ID: {{ .Values.vllm.model.id | quote }}
  MAX_MODEL_LEN: {{ .Values.vllm.model.maxLen | quote }}
  TENSOR_PARALLEL_SIZE: {{ .Values.vllm.engine.tensorParallelSize | quote }}
  GPU_MEMORY_UTILIZATION: {{ .Values.vllm.engine.gpuMemoryUtilization | quote }}
  MAX_NUM_SEQS: {{ .Values.vllm.engine.maxNumSeqs | quote }}
  MAX_NUM_BATCHED_TOKENS: {{ .Values.vllm.engine.maxNumBatchedTokens | quote }}
  SWAP_SPACE: {{ .Values.vllm.engine.swapSpace | quote }}
  MAX_NUM_CHUNKED_TOKENS: {{ .Values.vllm.engine.maxChunkedTokens | quote }}
